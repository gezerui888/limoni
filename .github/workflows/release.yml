# Builds the applications made with Limoni (zest, the limoni CLI, globe,
# backdrop-shell, the two games and pikap) for Linux, macOS and Windows when a
# version is tagged, and attaches them — with checksums and zest's .deb,
# .rpm and Arch packages — to the release. The release text is written by
# hand and left as it is (.goreleaser.yaml: release.mode keep-existing).
name: release binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable # the apps' own modules may ask for newer than the library's floor
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # limoni-mcp in the official MCP Registry (io.github.thebanri/limoni-mcp):
  # one bundle for every platform, attached to the release, then published
  # under this repository's own GitHub identity (OIDC) — no token is stored.
  # The registry takes each version once; a re-run after a successful publish
  # fails at the last step and changes nothing (the bundle is reproducible).
  mcp-registry:
    needs: goreleaser
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Bundle
        run: cmd/limoni-mcp/mcpb/pack.sh "${GITHUB_REF_NAME#v}" dist-mcp
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist-mcp/limoni-mcp.mcpb --clobber
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Publish
        run: |
          cmd/limoni-mcp/mcpb/get-publisher.sh
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish dist-mcp/server.json
